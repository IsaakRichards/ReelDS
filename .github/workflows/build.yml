name: build
on:
  push:
  workflow_dispatch:

jobs:
  # The bootloader + bootstub that ReelDS uses to start games are built from source with
  # devkitARM (the toolchain they're written for), then embedded by the BlocksDS build.
  loader:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      LOADER_COMMIT: a0f819008a63f28c4994e7cc8a8ace892450bbb5   # devkitPro/nds-bootloader
    steps:
      - uses: actions/checkout@v4
      - name: Build load.bin and bootstub.bin
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          mkdir -p ds/data
          git clone -q https://github.com/devkitPro/nds-bootloader /tmp/nds-bootloader
          git -C /tmp/nds-bootloader checkout -q "$LOADER_COMMIT"
          make -C /tmp/nds-bootloader LOADBIN="$GITHUB_WORKSPACE/ds/data/load.bin"
          cd ds/third_party/bootstub
          arm-none-eabi-gcc -Wl,-Ttext=0 -x assembler-with-cpp -nostartfiles -nostdlib bootstub.s -o bootstub.elf
          arm-none-eabi-objcopy -O binary bootstub.elf "$GITHUB_WORKSPACE/ds/data/bootstub.bin"
          ls -l "$GITHUB_WORKSPACE/ds/data"
      - uses: actions/upload-artifact@v4
        with:
          name: loader-bins
          path: ds/data/*.bin

  nds:
    needs: loader
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: loader-bins
          path: ds/data
      - name: Build reelds.nds
        run: make -C ds
      - uses: actions/upload-artifact@v4
        with:
          name: reelds-nds
          path: ds/reelds.nds

  codec-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy pillow
      - name: Encode a test clip and check the C decoder matches the Python one
        run: |
          mkdir -p t/lib/Test
          ffmpeg -v error -f lavfi -i testsrc2=s=640x360:r=30 -f lavfi -i sine=f=440 -t 5 t/lib/Test/clip.mp4
          python pc/reelds.py build t/lib --out t/sd --cache t/cache --jobs 1
          cc -O2 -Ids/source ds/test/decode_test.c ds/source/decode.c -o t/dec
          python - <<'EOF'
          import glob, subprocess, sys
          sys.path.insert(0, "pc"); import reelds
          for v in glob.glob("t/sd/reelds/videos/*.rdv"):
              subprocess.run(["t/dec", v, "t/c.rgb"], check=True)
              py = b"".join(rgb.tobytes() for _, rgb, _ in reelds.iter_decoded(v))
              assert open("t/c.rgb", "rb").read() == py, v
          print("decoders match")
          EOF

  # Every successful build of main replaces the "Latest build" release, so the newest
  # reelds.nds is always one click away (no GitHub login, no zip, never expires):
  #   https://github.com/<owner>/<repo>/releases/latest/download/reelds.nds
  # Pushing a tag like v1.0 makes a permanent, numbered release instead.
  release:
    needs: [nds, codec-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reelds-nds
      - name: Publish release
        run: |
          short="${GITHUB_SHA::7}"
          when="$(date -u '+%Y-%m-%d %H:%M UTC')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" reelds.nds --title "ReelDS $tag" --generate-notes --latest
          else
            tag=latest-build
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$tag" reelds.nds --target "$GITHUB_SHA" --latest \
              --title "Latest build ($short)" \
              --notes "Built automatically from \`$short\` on $when.

          Copy **reelds.nds** to your SD card and launch it from TWiLight Menu++ or Unlaunch.
          Encode videos on your PC with the encoder in this repo (\`reelds.cmd\` / \`reelds.sh\`)."
          fi
