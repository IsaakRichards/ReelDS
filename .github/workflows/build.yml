name: build
on:
  push:
  workflow_dispatch:

jobs:
  nds:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reelds.nds
        run: make -C ds
      - uses: actions/upload-artifact@v4
        with:
          name: reelds-nds
          path: ds/reelds.nds

  codec-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy pillow
      - name: Encode a test clip and check the C decoder matches the Python one
        run: |
          mkdir -p t/lib/Test
          ffmpeg -v error -f lavfi -i testsrc2=s=640x360:r=30 -f lavfi -i sine=f=440 -t 5 t/lib/Test/clip.mp4
          python pc/reelds.py build t/lib --out t/sd --cache t/cache --jobs 1
          cc -O2 -Ids/source ds/test/decode_test.c ds/source/decode.c -o t/dec
          python - <<'EOF'
          import glob, subprocess, sys
          sys.path.insert(0, "pc"); import reelds
          for v in glob.glob("t/sd/reelds/videos/*.rdv"):
              subprocess.run(["t/dec", v, "t/c.rgb"], check=True)
              py = b"".join(rgb.tobytes() for _, rgb, _ in reelds.iter_decoded(v))
              assert open("t/c.rgb", "rb").read() == py, v
          print("decoders match")
          EOF
